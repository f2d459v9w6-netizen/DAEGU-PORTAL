<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대구대학교 종합정보시스템</title>
  <style>
    :root {
      --primary-color: #006633;
      --border-color: #cccccc;
      --header-bg: #f8f9fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #e9ecef;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    /* 모바일 프레임 */
    .app-container {
      width: 100%;
      max-width: 430px;
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,0,0,0.15);
      position: relative;
    }

    /* 상단 공통 헤더 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-color);
      background-color: #ffffff;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--primary-color);
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .brand-logo {
      width: 24px;
      height: 24px;
      background-color: var(--primary-color);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: bold;
    }

    .top-icons {
      display: flex;
      gap: 12px;
      font-size: 18px;
      color: #444;
      cursor: pointer;
    }

    /* 페이지 전환용 스타일 */
    .page {
      display: none;
      flex-direction: column;
      flex: 1;
    }

    .page.active {
      display: flex;
    }

    /* ---------------- PAGE 1: 메인 화면 ---------------- */
    .profile-card {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #f0f0f0;
    }

    .user-name {
      font-size: 20px;
      font-weight: bold;
      color: #111;
    }

    .user-dept {
      font-size: 13px;
      color: var(--primary-color);
      margin-top: 4px;
    }

    .id-btn {
      border: 1px solid #a3d9b1;
      background-color: #f2f9f4;
      color: var(--primary-color);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      text-align: center;
      cursor: pointer;
    }

    .section-title {
      background-color: var(--primary-color);
      color: white;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: bold;
      margin-top: 10px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background-color: #eee;
      border-bottom: 1px solid #eee;
    }

    .grid-item {
      background-color: #fff;
      padding: 16px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #333;
      cursor: pointer;
      text-decoration: none;
    }

    .grid-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-color: #f4f6f8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    /* ---------------- PAGE 2: 성적 조회 화면 ---------------- */
    .sub-header {
      background-color: #ffffff;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .page-path {
      font-size: 12px;
      color: #666;
    }

    .page-title-text {
      font-size: 16px;
      font-weight: bold;
      color: #000;
      margin: 10px 14px 6px;
    }

    .info-table {
      width: calc(100% - 28px);
      margin: 0 14px 14px;
      border-collapse: collapse;
      font-size: 12px;
    }

    .info-table th, .info-table td {
      border: 1px solid var(--border-color);
      padding: 5px 8px;
      text-align: left;
    }

    .info-table th {
      background-color: #f5f5f5;
      font-weight: normal;
      color: #333;
      width: 28%;
    }

    .photo-area {
      width: 110px;
      padding: 2px !important;
      text-align: center;
      vertical-align: middle;
    }

    .profile-img {
      width: 100%;
      height: 135px;
      object-fit: cover;
      display: block;
    }

    /* 탭 메뉴 */
    .tab-group {
      display: flex;
      margin: 0 14px;
      border-bottom: 2px solid var(--primary-color);
    }

    .tab-item {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: bold;
      background-color: #f2f3f5;
      color: #555;
      border: 1px solid var(--border-color);
      border-bottom: none;
      margin-right: 2px;
      border-radius: 4px 4px 0 0;
      cursor: pointer;
    }

    .tab-item.active {
      background-color: var(--primary-color);
      color: #ffffff;
      border-color: var(--primary-color);
    }

    .radio-options {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding: 6px 14px;
      font-size: 12px;
      color: #d9534f;
      font-weight: bold;
    }

    .tab-content {
      display: none;
      padding: 0 14px 20px;
    }

    .tab-content.active {
      display: block;
    }

    .table-scroll-wrapper {
      overflow-x: auto;
    }

    .grade-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: center;
      white-space: nowrap;
    }

    .grade-table th, .grade-table td {
      border: 1px solid var(--border-color);
      padding: 7px 8px;
    }

    .grade-table th {
      background-color: #ffffff;
      color: #000;
      font-weight: bold;
    }

    .grade-table td {
      background-color: #c5e1a5;
      color: #000;
    }

    /* 하단 바 */
    .footer-bar {
      margin-top: auto;
      background-color: var(--primary-color);
      color: white;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="app-container">

  <!-- 상단 공통 헤더 (로고나 홈 버튼 누르면 메인으로) -->
  <div class="top-bar">
    <div class="brand" onclick="showPage('portalPage')">
      <span class="brand-logo">DU</span>
      <span>대구대학교</span>
    </div>
    <div class="top-icons">
      <span onclick="showPage('portalPage')">🏠</span>
      <span>🔔</span>
      <span onclick="showPage('gradePage')">☰</span>
    </div>
  </div>

  <!-- PAGE 1: 메인 화면 (첫 화면) -->
  <div id="portalPage" class="page active">
    <div class="profile-card">
      <div>
        <div class="user-name">김우람</div>
        <div class="user-dept">간호대학 간호학과</div>
      </div>
      <div class="id-btn">
        <div>📱</div>
        <div>신분증</div>
      </div>
    </div>

    <div class="section-title">스마트서비스</div>

    <div class="grid-container">
      <div class="grid-item">
        <div class="grid-icon">🐯</div>
        <div>Tigers+</div>
      </div>
      <div class="grid-item">
        <div class="grid-icon">📚</div>
        <div>스마트LMS</div>
      </div>
      <div class="grid-item">
        <div class="grid-icon">📄</div>
        <div>비교과시스템</div>
      </div>
      <div class="grid-item">
        <div class="grid-icon">💬</div>
        <div>학생상담</div>
      </div>
      <div class="grid-item">
        <div class="grid-icon">📞</div>
        <div>전화번호안내</div>
      </div>
      <!-- ⭐ 이 메뉴를 누르면 성적조회 페이지로 이동합니다! ⭐ -->
      <div class="grid-item" onclick="showPage('gradePage')">
        <div class="grid-icon">✏️</div>
        <div>성적조회 이동</div>
      </div>
    </div>
  </div>

  <!-- PAGE 2: 성적 조회 화면 -->
  <div id="gradePage" class="page">
    <div class="sub-header">
      <div class="page-path">
        <span>학적·졸업</span> &gt; <span>학적관리</span> &gt; <b>성적조회</b>
      </div>
      <span style="font-size: 11px; color:#666;">★ 즐겨찾기</span>
    </div>

    <div class="page-title-text">성적조회</div>

    <!-- 인적사항 테이블 및 증명사진 -->
    <table class="info-table">
      <tr>
        <th>학번</th>
        <td>22607914</td>
        <td rowspan="5" class="photo-area">
          <img class="profile-img" src="목.jpg" alt="증명사진" onerror="this.src='https://via.placeholder.com/110x135?text=Photo'">
        </td>
      </tr>
      <tr>
        <th>성명</th>
        <td>김우람</td>
      </tr>
      <tr>
        <th>대학</th>
        <td>간호대학</td>
      </tr>
      <tr>
        <th>학년</th>
        <td>1</td>
      </tr>
      <tr>
        <th>주야</th>
        <td>주간</td>
      </tr>
      <tr>
        <th>학과(부)/전공</th>
        <td colspan="2">간호학과</td>
      </tr>
    </table>

    <!-- 탭 메뉴 -->
    <div class="tab-group">
      <div id="tab1-btn" class="tab-item" onclick="switchTab('tab1')">성적일람표</div>
      <div id="tab2-btn" class="tab-item active" onclick="switchTab('tab2')">성적집계표</div>
    </div>

    <div class="radio-options">
      <label><input type="radio" name="f_option" checked> F 포함</label>
      <label><input type="radio" name="f_option"> F 미포함</label>
    </div>

    <!-- 탭 1: 성적일람표 (빈 화면) -->
    <div id="tab1" class="tab-content">
      <div style="min-height: 150px;"></div>
    </div>

    <!-- 탭 2: 성적집계표 -->
    <div id="tab2" class="tab-content active">
      <div class="table-scroll-wrapper">
        <table class="grade-table">
          <thead>
            <tr>
              <th rowspan="2">합계</th>
              <th rowspan="2">평점평균</th>
              <th rowspan="2">실점평균</th>
              <th rowspan="2">부전공</th>
              <th colspan="2">복수전공</th>
            </tr>
            <tr>
              <th>1</th>
              <th>2</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>19</td>
              <td>3.92</td>
              <td>90.35</td>
              <td>0</td>
              <td>0</td>
              <td>0</td>
            </tr>
          </tbody>
        </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 하단 종합정보서비스 -->
  <div class="footer-bar">
    <span>종합정보서비스</span>
    <span>▲</span>
  </div>

</div>

<script>
  // 화면 전환 함수 (메인 <-> 성적조회)
  function showPage(pageId) {
    document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
  }

  // 탭 전환 함수 (성적일람표 <-> 성적집계표)
  function switchTab(tabId) {
    document.querySelectorAll('.tab-item').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

    if (tabId === 'tab1') {
      document.getElementById('tab1-btn').classList.add('active');
      document.getElementById('tab1').classList.add('active');
    } else {
      document.getElementById('tab2-btn').classList.add('active');
      document.getElementById('tab2').classList.add('active');
    }
  }
</script>

</body>
</html>
